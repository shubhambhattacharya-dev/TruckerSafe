# Render blueprint — backend web service (Django + Gunicorn + WhiteNoise).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: truckersafe-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --timeout 120 --workers 2
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: truckersafe-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://truckersafe.vercel.app,http://localhost:5173
      - key: GEOCODER_USER_AGENT
        value: TruckerSafeWeatherApp/1.0 (https://github.com/shubhambhattacharya-dev/TruckerSafe)
